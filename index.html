  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" sizes="180x180" />
  <script>
    // Start the game data downloads right away, in parallel with the module graph below (app.js picks these
    // promises up in boot; without them it fetches the files itself). Keep the list = DATA_FILES in
    // src/core/data.js (tests/sw-pwa.test.mjs checks it).
    (function () {
      try {
        var files = ['scenario', 'actors', 'vehicles', 'spacecraft', 'destinations', 'calendar', 'politics', 'geopolitics', 'tech', 'events', 'crew', 'bodies'];
        var out = {};
        files.forEach(function (n) {
          var p = fetch('data/' + n + '.json', { cache: 'no-cache' }).then(function (r) {
            if (!r.ok) throw new Error(n + '.json ' + r.status);
            return r.json();
          });
          p.catch(function () { /* app.js retries on its own */ });
          out[n] = p;
        });
        window.__adastraData = out;
      } catch (e) { /* old browser: app.js loads the data */ }
    })();
  </script>
